; PlatformIO Project Configuration File
; Projet GBF - Module INFO5 (R5.10 Systèmes Embarqués Temps Réel)
; Carte cible : M5Stack Core 2 (ESP32)

[env:m5stack-core2]
platform = espressif32
board = m5stack-core2
framework = arduino
lib_deps = m5stack/M5Unified@^0.2.13
monitor_speed = 115200
monitor_filters = default, send_on_enter
